  </g>

  <!-- legend -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" fill="#374151">
    <rect x="95"  y="470" width="14" height="14" fill="#6366F1"/>
    <text x="115" y="481">Precision@5</text>
