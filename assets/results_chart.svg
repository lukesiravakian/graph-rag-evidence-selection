    <text x="100" y="132" text-anchor="end">0.8</text>
    <text x="100" y="64"  text-anchor="end">1.0</text>
  </g>
  <line x1="110" y1="60" x2="110" y2="400" stroke="#D1D5DB" stroke-width="1"/>

