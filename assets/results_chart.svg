  <text x="450" y="508" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Source: Week 3 full comparison (results/week3_full_comparison.json) — see Results section for discussion</text>
