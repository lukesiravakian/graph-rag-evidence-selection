  <rect x="657" y="352.4" width="32" height="47.6"  fill="#6366F1"/>
  <rect x="695" y="155.2" width="32" height="244.8" fill="#22C55E"/>
  <rect x="733" y="183.6" width="32" height="216.4" fill="#F59E0B"/>
