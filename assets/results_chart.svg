  <text x="749" y="178" font-size="10.5" text-anchor="middle" fill="#374151">0.78</text>
  <text x="787" y="394" font-size="10.5" text-anchor="middle" fill="#374151">0.00</text>

  <!-- x-axis group labels -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#111827" text-anchor="middle">
    <text x="190" y="422">Top-k Baseline</text>
    <text x="370" y="422">MMR</text>
